# ha_mcp_backup
schema_version: 1
domain: automation
entity_id: floor_heating_presence_memory
captured: '2026-10-11T22:04:39.313606+00:00'
tool: ha_config_set_automation
config:
  id: floor_heating_presence_memory
  alias: Floor Heating - Presence Memory
  description: Record confirmed presence after 30 seconds; refresh each minute while
    occupied. Persistent timestamp holds occupancy for 45 minutes across HA restarts.
  triggers:
  - trigger: state
    entity_id: binary_sensor.presents_sensor_zg_204zx
    to: 'on'
    for:
      seconds: 30
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: binary_sensor.presents_sensor_zg_204zx
    state: 'on'
    for:
      seconds: 30
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.floor_heating_last_presence
    data:
      timestamp: '{{ now().timestamp() }}'
  mode: restart
