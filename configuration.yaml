# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include_dir_merge_named scripts
scene: !include scenes.yaml

modbus: !include_dir_merge_list modbus

sensor:
  - platform: torque
    email: jaskier

lovelace:
  dashboards:
    victron-dashboard:
      mode: yaml
      title: Victron
      icon: mdi:flash
      show_in_sidebar: true
      filename: dashboards/victron_dashboard.yaml

input_select:
  water_mode_target:
    name: Water Mode Target
    options:
      - Normal
      - Pump Filling
      - Grid Filling
      - Grid
    initial: Normal
    icon: mdi:water-sync

  water_mode_current:
    name: Water Mode Current
    options:
      - Normal
      - Pump Filling
      - Grid Filling
      - Grid
    initial: Normal
    icon: mdi:water-check

input_boolean:
  water_heating_enabled:
    name: Water Heating Enabled
    initial: false
    icon: mdi:water-boiler

input_number:
  water_heating_target_temp:
    name: Water Heating Target Temp
    min: 30
    max: 80
    step: 0.5
    initial: 45
    unit_of_measurement: "°C"
    icon: mdi:thermometer-water

  water_heating_hysteresis:
    name: Water Heating Hysteresis
    min: 1
    max: 15
    step: 0.5
    initial: 3
    unit_of_measurement: "°C"
    icon: mdi:delta

template:
  - binary_sensor:
      - name: Water Mode Normal Selected
        unique_id: water_mode_normal_selected
        state: "{{ is_state('input_select.water_mode_target', 'Normal') }}"

      - name: Water Mode Pump Filling Selected
        unique_id: water_mode_pump_filling_selected
        state: "{{ is_state('input_select.water_mode_target', 'Pump Filling') }}"

      - name: Water Mode Grid Filling Selected
        unique_id: water_mode_grid_filling_selected
        state: "{{ is_state('input_select.water_mode_target', 'Grid Filling') }}"

      - name: Water Mode Grid Selected
        unique_id: water_mode_grid_selected
        state: "{{ is_state('input_select.water_mode_target', 'Grid') }}"

    sensor:
      - name: "Water Tank Liters"
        unique_id: water_tank_liters_rational
        unit_of_measurement: "L"
        device_class: water
        state_class: measurement
        icon: mdi:water
        availability: >
          {{ states('sensor.water_height')
             not in ['unknown', 'unavailable', 'none', ''] }}
        state: >
          {% set h = states('sensor.water_height') | float(0) %}

          {% if h <= 0 %}
            0
          {% elif h >= 55.8 %}
            100
          {% else %}
            {% set numerator =
              0.668752847 * h
              - 0.0296241152 * h**2
              + 0.00171244226 * h**3
              - 0.0000722092929 * h**4
              + 0.00000103272088 * h**5
            %}

            {% set denominator =
              1
              - 0.00347494792 * h
              - 0.00156556425 * h**2
              + 0.0000292356265 * h**3
            %}

            {{ (numerator / denominator) | round(1) }}
          {% endif %}
      - name: VE.Bus Switch Position Mode
        unique_id: victron_vebus_switch_position_mode
        state: >
          {% set mode = states('select.inverter') | lower %}
          {% if 'charger' in mode %}
            Charger Only
          {% elif 'inverter' in mode %}
            Inverter Only
          {% elif mode == 'on' %}
            On
          {% elif mode == 'off' %}
            Off
          {% else %}
            Unknown
          {% endif %}

      - name: Orion XS Input Battery State of Charge
        unique_id: orion_xs_input_battery_state_of_charge
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: "{{ states('sensor.orion_xs_input_voltage') | float(none) is not none }}"
        state: >
          {% set voltage = states('sensor.orion_xs_input_voltage') | float(none) %}
          {% if voltage is none %}
            {{ none }}
          {% else %}
            {# Approximate 12V lead-acid resting reference: 11.8V empty, 12.8V full; calibrate thresholds for battery chemistry/age and load profile #}
            {% set empty_soc_voltage = 11.8 %}
            {% set full_soc_voltage = 12.8 %}
            {% set soc = ((voltage - empty_soc_voltage) / (full_soc_voltage - empty_soc_voltage)) * 100 %}
            {% if soc < 0 %}
              0
            {% elif soc > 100 %}
              100
            {% else %}
              {{ soc | round(0) }}
            {% endif %}
          {% endif %}

    select:
      - name: Inverter Mode
        unique_id: victron_inverter_mode_control
        state: >
          {% set mode = states('select.inverter') | lower %}
          {% if 'charger' in mode %}
            Charger Only
          {% elif 'inverter' in mode %}
            Inverter Only
          {% elif mode == 'on' %}
            On
          {% elif mode == 'off' %}
            Off
          {% else %}
            Unknown
          {% endif %}
        options: "{{ ['Charger Only', 'Inverter Only', 'On', 'Off'] }}"
        select_option:
          - service: select.select_option
            target:
              entity_id: select.inverter
            data:
              option: >
                {% set map = {
                  'Charger Only': 'charger_only',
                  'Inverter Only': 'inverter_only',
                  'On': 'on',
                  'Off': 'off'
                } %}
                {{ map.get(option, option) }}

    switch:
      - name: Inverter Enabled
        unique_id: victron_inverter_power_switch
        state: "{{ states('select.inverter') | lower == 'on' }}"
        turn_on:
          - service: select.select_option
            target:
              entity_id: select.inverter
            data:
              option: "on"
        turn_off:
          - service: select.select_option
            target:
              entity_id: select.inverter
            data:
              option: "off"

  - trigger:
      - platform: state
        entity_id: sensor.jaskier_wican_obd_pro_31_distancesincecodeclear
      - platform: state
        entity_id: sensor.jaskier_wican_obd_pro_30_warmupssincecodeclear
    sensor:
      - name: OBD Trip Distance
        unique_id: jaskier_obd_trip_distance
        unit_of_measurement: "km"
        device_class: distance
        state_class: measurement
        state: >
          {% set distance = states('sensor.jaskier_wican_obd_pro_31_distancesincecodeclear') | float(0) %}
          {% set warmups = states('sensor.jaskier_wican_obd_pro_30_warmupssincecodeclear') | int(0) %}
          {% set last_warmups = this.attributes.get('last_warmups', warmups) | int(0) %}
          {% set baseline = this.attributes.get('baseline_distance', distance) | float(0) %}
          {% set previous_trip = this.state | float(0) %}
          {% if warmups != last_warmups %}
            {{ [distance - baseline, 0] | max | round(2) }}
          {% else %}
            {{ previous_trip | round(2) }}
          {% endif %}
        attributes:
          current_trip_distance: >
            {% set distance = states('sensor.jaskier_wican_obd_pro_31_distancesincecodeclear') | float(0) %}
            {% set warmups = states('sensor.jaskier_wican_obd_pro_30_warmupssincecodeclear') | int(0) %}
            {% set last_warmups = this.attributes.get('last_warmups', warmups) | int(0) %}
            {% set baseline = this.attributes.get('baseline_distance', distance) | float(0) %}
            {% if warmups != last_warmups %}
              0
            {% else %}
              {{ [distance - baseline, 0] | max | round(2) }}
            {% endif %}
          baseline_distance: >
            {% set distance = states('sensor.jaskier_wican_obd_pro_31_distancesincecodeclear') | float(0) %}
            {% set warmups = states('sensor.jaskier_wican_obd_pro_30_warmupssincecodeclear') | int(0) %}
            {% set last_warmups = this.attributes.get('last_warmups', warmups) | int(0) %}
            {% set baseline = this.attributes.get('baseline_distance', distance) | float(0) %}
            {% if warmups != last_warmups %}
              {{ distance }}
            {% else %}
              {{ baseline }}
            {% endif %}
          last_warmups: "{{ states('sensor.jaskier_wican_obd_pro_30_warmupssincecodeclear') | int(0) }}"

      - name: OBD Current Trip Distance
        unique_id: jaskier_obd_current_trip_distance
        unit_of_measurement: "km"
        device_class: distance
        state_class: measurement
        state: "{{ state_attr('sensor.obd_trip_distance', 'current_trip_distance') | float(0) | round(2) }}"

  - sensor:
      - name: "EWD108 Fix Status"
        unique_id: ewd108_fix_status
        state: >
          {% set v = states('sensor.ewd108_position_valid') | int(-1) %}
          {% if v == 1 %}
            Valid
          {% elif v == 0 %}
            Invalid
          {% else %}
            Unknown
          {% endif %}

      - name: "EWD108 Longitude Direction"
        unique_id: ewd108_longitude_direction
        state: >
          {% set v = states('sensor.ewd108_longitude_direction_raw') | int(0) %}
          {% if v == 69 %}
            E
          {% elif v == 87 %}
            W
          {% else %}
            Unknown
          {% endif %}

      - name: "EWD108 Latitude Direction"
        unique_id: ewd108_latitude_direction
        state: >
          {% set v = states('sensor.ewd108_latitude_direction_raw') | int(0) %}
          {% if v == 78 %}
            N
          {% elif v == 83 %}
            S
          {% else %}
            Unknown
          {% endif %}

      - name: "EWD108 Signed Longitude"
        unique_id: ewd108_signed_longitude
        unit_of_measurement: "°"
        state: >
          {% set lon = states('sensor.ewd108_longitude') | float(0) %}
          {% set dir = states('sensor.ewd108_longitude_direction') %}
          {% if dir == 'W' %}
            {{ -lon }}
          {% else %}
            {{ lon }}
          {% endif %}

      - name: "EWD108 Signed Latitude"
        unique_id: ewd108_signed_latitude
        unit_of_measurement: "°"
        state: >
          {% set lat = states('sensor.ewd108_latitude') | float(0) %}
          {% set dir = states('sensor.ewd108_latitude_direction') %}
          {% if dir == 'S' %}
            {{ -lat }}
          {% else %}
            {{ lat }}
          {% endif %}

      - name: "EWD108 Speed Over Ground kmh"
        unique_id: ewd108_speed_over_ground_kmh
        unit_of_measurement: "km/h"
        state: >
          {{ (states('sensor.ewd108_speed_over_ground') | float(0) * 1.852) | round(2) }}

      - name: "EWD108 GNSS UTC Time"
        unique_id: ewd108_gnss_utc_time
        state: >
          {% set y = states('sensor.ewd108_year') | int(0) %}
          {% set mo = states('sensor.ewd108_month') | int(0) %}
          {% set d = states('sensor.ewd108_day') | int(0) %}
          {% set h = states('sensor.ewd108_hour_utc') | int(0) %}
          {% set mi = states('sensor.ewd108_minute_utc') | int(0) %}
          {% set s = states('sensor.ewd108_second_utc') | int(0) %}
          {% if y > 2000 and mo > 0 and d > 0 %}
            {{ "%04d-%02d-%02d %02d:%02d:%02d UTC" | format(y, mo, d, h, mi, s) }}
          {% else %}
            unknown
          {% endif %}

      - name: "EWD108 Antenna Mode"
        unique_id: ewd108_antenna_mode
        state: >
          {% set v = states('sensor.ewd108_antenna_setting') | int(-1) %}
          {% if v == 0 %}
            Active
          {% elif v == 1 %}
            Passive
          {% else %}
            Unknown
          {% endif %}

      - name: "EWD108 Update Frequency Text"
        unique_id: ewd108_update_frequency_text
        state: >
          {% set v = states('sensor.ewd108_update_frequency') | int(-1) %}
          {% if v == 0 %}
            1 Hz
          {% elif v == 1 %}
            10 Hz
          {% else %}
            Unknown
          {% endif %}
