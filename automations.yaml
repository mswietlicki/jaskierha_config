- id: '1786996780821'
  alias: Toggle Inverter Power On Double Press
  description: This automation toggles the inverter power on double press of a remote
    button.
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: e4:56:ac:ff:fe:56:8b:8c
      command: 'on'
  conditions: []
  actions:
  - action: switch.toggle
    metadata: {}
    target:
      entity_id: switch.inverter_power
    data: {}
  mode: single
- id: '1787042217987'
  alias: Water - Maintenance Gate
  description: Suppress normal water and hot-water automation during service overrides.
    Stop active transitions on entry and only leave maintenance when physical states
    match a known water mode.
  triggers:
  - trigger: state
    entity_id: input_boolean.water_maintenance
    to: 'on'
    id: enabled
  - trigger: state
    entity_id: input_boolean.water_maintenance
    to: 'off'
    id: disabled
  - trigger: homeassistant
    event: start
    id: startup
    note: Re-assert the maintenance safety gate after a restart if the helper restored
      on.
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - enabled
        - startup
      - condition: state
        entity_id: input_boolean.water_maintenance
        state: 'on'
      sequence:
      - action: script.turn_off
        target:
          entity_id:
          - script.water_mode_grid
          - script.water_mode_grid_filling
          - script.water_mode_normal
          - script.water_mode_pump_filling
          - script.water_set_mode
          - script.water_transition_grid_filling_to_grid
          - script.water_transition_grid_to_grid_filling
          - script.water_transition_grid_to_normal
          - script.water_transition_grid_to_pump_filling
          - script.water_transition_grid_filling_to_normal
          - script.water_transition_grid_filling_to_pump_filling
          - script.water_transition_normal_to_grid
          - script.water_transition_normal_to_grid_filling
          - script.water_transition_normal_to_pump_filling
          - script.water_transition_pump_filling_to_grid
          - script.water_transition_pump_filling_to_grid_filling
          - script.water_transition_pump_filling_to_normal
        note: Cancel any transition already in progress before direct service control
          begins.
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.water_heating_enabled
        note: Automatic hot water must be explicitly re-enabled after maintenance.
      - action: switch.turn_off
        target:
          entity_id: switch.water_heater_relay
        note: Start heater service work from a known safe off state.
      - action: persistent_notification.create
        data:
          notification_id: water_maintenance_active
          title: Water Maintenance active
          message: Normal water-mode transitions, tank-full mode changes, and automatic
            hot-water control are suppressed. Use only the manual controls on the Water
            Maintenance view.
    - conditions:
      - condition: trigger
        id: disabled
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: switch.water_pump_relay
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_pump_overwrite
            state: 'off'
          - condition: state
            entity_id: switch.water_valve_loop
            state: 'off'
          - condition: state
            entity_id: switch.water_valve_grid
            state: 'off'
          - condition: state
            entity_id: switch.water_valve_tank
            state: 'off'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_current
            data:
              option: Normal
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_target
            data:
              option: Normal
        - conditions:
          - condition: state
            entity_id: switch.water_pump_relay
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_pump_overwrite
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_loop
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_grid
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_tank
            state: 'off'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_current
            data:
              option: Pump Filling
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_target
            data:
              option: Pump Filling
        - conditions:
          - condition: state
            entity_id: switch.water_pump_relay
            state: 'off'
          - condition: state
            entity_id: switch.water_valve_pump_overwrite
            state: 'off'
          - condition: state
            entity_id: switch.water_valve_loop
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_grid
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_tank
            state: 'off'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_current
            data:
              option: Grid Filling
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_target
            data:
              option: Grid Filling
        - conditions:
          - condition: state
            entity_id: switch.water_pump_relay
            state: 'off'
          - condition: state
            entity_id: switch.water_valve_pump_overwrite
            state: 'off'
          - condition: state
            entity_id: switch.water_valve_loop
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_grid
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_tank
            state: 'on'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_current
            data:
              option: Grid
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_target
            data:
              option: Grid
        default:
        - action: persistent_notification.create
          data:
            notification_id: water_maintenance_exit_blocked
            title: Water Maintenance exit blocked
            message: Pump and valve states do not match a known water mode. Maintenance
              has been re-enabled; correct the manual switch states before trying again.
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.water_maintenance
        - stop: Physical water state is not a recognized mode.
          error: true
      - action: persistent_notification.dismiss
        data:
          notification_id: water_maintenance_active
      - action: persistent_notification.dismiss
        data:
          notification_id: water_maintenance_exit_blocked
  mode: queued
  max: 3
- id: water_mode_reconcile_on_start
  alias: Water - Reconcile Mode on Start
  description: Restore the logical water mode from the physical pump and valve states.
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.water_maintenance
    state: 'off'
    note: Preserve direct service overrides across a restart.
  actions:
  - wait_template: >-
      {{ has_value('switch.water_pump_relay') and
         has_value('switch.water_valve_pump_overwrite') and
         has_value('switch.water_valve_loop') and
         has_value('switch.water_valve_grid') and
         has_value('switch.water_valve_tank') }}
    timeout: 00:02:00
    continue_on_timeout: false
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{ is_state('switch.water_pump_relay', 'on') and
             is_state('switch.water_valve_pump_overwrite', 'off') and
             is_state('switch.water_valve_loop', 'off') and
             is_state('switch.water_valve_grid', 'off') and
             is_state('switch.water_valve_tank', 'off') }}
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.water_mode_current
          - input_select.water_mode_target
        data:
          option: Normal
    - conditions:
      - condition: template
        value_template: >-
          {{ is_state('switch.water_pump_relay', 'on') and
             is_state('switch.water_valve_pump_overwrite', 'on') and
             is_state('switch.water_valve_loop', 'on') and
             is_state('switch.water_valve_grid', 'on') and
             is_state('switch.water_valve_tank', 'off') }}
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.water_mode_current
          - input_select.water_mode_target
        data:
          option: Pump Filling
    - conditions:
      - condition: template
        value_template: >-
          {{ is_state('switch.water_pump_relay', 'off') and
             is_state('switch.water_valve_pump_overwrite', 'off') and
             is_state('switch.water_valve_loop', 'on') and
             is_state('switch.water_valve_grid', 'on') and
             is_state('switch.water_valve_tank', 'off') }}
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.water_mode_current
          - input_select.water_mode_target
        data:
          option: Grid Filling
    - conditions:
      - condition: template
        value_template: >-
          {{ is_state('switch.water_pump_relay', 'off') and
             is_state('switch.water_valve_pump_overwrite', 'off') and
             is_state('switch.water_valve_loop', 'on') and
             is_state('switch.water_valve_grid', 'on') and
             is_state('switch.water_valve_tank', 'on') }}
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.water_mode_current
          - input_select.water_mode_target
        data:
          option: Grid
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.water_pump_relay
    - action: input_select.select_option
      target:
        entity_id: input_select.water_mode_current
      data:
        option: Fault
    - action: persistent_notification.create
      data:
        notification_id: water_mode_fault
        title: Water mode fault
        message: >-
          Pump and valve states do not match a known water mode. The water pump
          was stopped; inspect the valve states before selecting another mode.
  mode: single
