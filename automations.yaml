        }}

        '
  - action: persistent_notification.create
    data:
      notification_id: victron_solar_charger_error
      title: Victron SmartSolar Warning
      message: 'SmartSolar charger issue on {{ trigger.to_state.name }}: {{ trigger.to_state.state }}'
