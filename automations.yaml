      message: 'Dynamic ESS error: {{ trigger.to_state.state }}'
  mode: single
- id: victron_solar_charger_error_notifications
  alias: Victron - Solar Charger Error Notifications
  description: Notify when a SmartSolar charger enters a real error state; ignore
    no_error, unknown, and unavailable transitions.
  triggers:
  - trigger: state
    entity_id:
    - sensor.smartsolar_charger_mppt_100_30_id_278_error_code
    - sensor.smartsolar_charger_mppt_100_30_id_279_error_code
    not_to:
    - no_error
