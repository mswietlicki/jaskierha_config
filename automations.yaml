- id: '1772610742505'
  alias: Toggle Light on Button Press
  description: Toggle the main light when either ZHA button sends a short-press command.
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: e4:56:ac:ff:fe:61:3b:4f
      command: toggle
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: e4:56:ac:ff:fe:56:8b:8c
      command: toggle
  conditions: []
  actions:
  - action: light.toggle
    metadata: {}
    target:
      entity_id: light.relay_0
    data: {}
  mode: single
- id: '1772611103694'
  alias: Temperature - Freezing Warning/Error
  description: Warn before freezing and alert on freeze.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.sensor_internal_temperature
    below: 3
    for:
      minutes: 5
    id: warning
  - trigger: numeric_state
    entity_id:
    - sensor.sensor_internal_temperature
    below: 0
    for:
      minutes: 2
    id: critical
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: warning
      sequence:
      - action: notify.notify
        continue_on_error: true
        data:
          title: Temperature Warning
          message: 'Internal temperature is low: {{ states(''sensor.sensor_internal_temperature'')
            }} °C

            '
    - conditions:
      - condition: trigger
        id: critical
      sequence:
      - action: notify.notify
        continue_on_error: true
        data:
          title: Temperature Error - Freezing Risk
          message: 'Freezing detected. Internal temperature is {{ states(''sensor.sensor_internal_temperature'')
            }} °C

            '
  mode: queued
  max: 5
- id: '1776195340767'
  alias: Victron - Battery Warning/Error
  description: Notify on low battery voltage and low battery charge.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.shunt_main_dc_bus_voltage
    above: 12.2
    below: 12.8
    for:
      minutes: 2
    id: voltage_warning
  - trigger: numeric_state
    entity_id:
    - sensor.shunt_main_dc_bus_voltage
    below: 12.2
    for:
      minutes: 2
    id: voltage_error
  - trigger: numeric_state
    entity_id:
    - sensor.shunt_main_charge
    above: 15
    below: 25
    for:
      minutes: 2
    id: soc_warning
  - trigger: numeric_state
    entity_id:
    - sensor.shunt_main_charge
    below: 15
    for:
      minutes: 2
    id: soc_error
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: voltage_warning
      sequence:
      - action: notify.notify
        continue_on_error: true
        data:
          title: Victron Battery Warning
          message: 'Battery voltage low: {{ states(''sensor.shunt_main_dc_bus_voltage'')
            }} V'
    - conditions:
      - condition: trigger
        id: voltage_error
      sequence:
      - action: notify.notify
        continue_on_error: true
        data:
          title: Victron Battery Error
          message: 'Battery voltage critical: {{ states(''sensor.shunt_main_dc_bus_voltage'')
            }} V'
    - conditions:
      - condition: trigger
        id: soc_warning
      sequence:
      - action: notify.notify
        continue_on_error: true
        data:
          title: Victron Battery Warning
          message: 'Battery charge low: {{ states(''sensor.shunt_main_charge'') }}
            %'
    - conditions:
      - condition: trigger
        id: soc_error
      sequence:
      - action: notify.notify
        continue_on_error: true
        data:
          title: Victron Battery Error
          message: 'Battery charge critical: {{ states(''sensor.shunt_main_charge'')
            }} %'
  - action: persistent_notification.create
    data:
      notification_id: victron_battery_alert
      title: Victron Battery Alert
      message: "{% if trigger.id.startswith('voltage') %}\n  Battery voltage is {{
        states('sensor.shunt_main_dc_bus_voltage') }} V\n  ({{ 'critical' if trigger.id
        == 'voltage_error' else 'warning' }}).\n{% else %}\n  Battery charge is {{
        states('sensor.shunt_main_charge') }}%\n  ({{ 'critical' if trigger.id ==
        'soc_error' else 'warning' }}).\n{% endif %}"
  mode: queued
  max: 10
- id: victron_inverter_alarm_notifications
  alias: Victron - Inverter Alarm Warning/Error
  description: Notify only when an inverter alarm sensor enters warning or alarm;
    ignore no_alarm, unknown, and unavailable transitions.
  triggers:
  - trigger: state
    entity_id:
    - sensor.inverter_grid_lost_alarm
    - sensor.inverter_high_dc_current_alarm
    - sensor.inverter_high_dc_voltage_alarm
    - sensor.inverter_high_temperature_alarm
    - sensor.inverter_low_battery_alarm
    - sensor.inverter_overload_alarm
    - sensor.inverter_phase_rotation_alarm
    - sensor.inverter_ripple_alarm
    - sensor.inverter_temperature_sensor_alarm
    - sensor.inverter_voltage_sensor_alarm
    to: warning
    id: warning
  - trigger: state
    entity_id:
    - sensor.inverter_grid_lost_alarm
    - sensor.inverter_high_dc_current_alarm
    - sensor.inverter_high_dc_voltage_alarm
    - sensor.inverter_high_temperature_alarm
    - sensor.inverter_low_battery_alarm
    - sensor.inverter_overload_alarm
    - sensor.inverter_phase_rotation_alarm
    - sensor.inverter_ripple_alarm
    - sensor.inverter_temperature_sensor_alarm
    - sensor.inverter_voltage_sensor_alarm
    to: alarm
    id: alarm
  actions:
  - action: notify.send_message
    continue_on_error: true
    target:
      entity_id: notify.msphone29
    data:
      title: Victron Inverter Alarm
      message: 'Inverter alarm on {{ trigger.to_state.name }}: {{ trigger.to_state.state
        }}

        '
  - action: persistent_notification.create
    data:
      notification_id: victron_inverter_alarm
      title: Victron Inverter Alarm
      message: 'Inverter alarm on {{ trigger.to_state.name }}: {{ trigger.to_state.state
        }}'
  mode: queued
  max: 20
- id: victron_dynamic_ess_error_notification
  alias: Victron - Dynamic ESS Error Notification
  description: Notify when Dynamic ESS enters a real error state; ignore no_error,
    unknown, and unavailable transitions.
  triggers:
  - trigger: state
    entity_id:
    - sensor.gx_device_dynamic_ess_error
    not_to:
    - no_error
    - unknown
    - unavailable
  actions:
  - action: notify.send_message
    continue_on_error: true
    target:
      entity_id: notify.msphone29
    data:
      title: Victron Dynamic ESS Error
      message: 'Dynamic ESS error: {{ trigger.to_state.state }}'
  - action: persistent_notification.create
    data:
      notification_id: victron_dynamic_ess_error
      title: Victron Dynamic ESS Error
      message: 'Dynamic ESS error: {{ trigger.to_state.state }}'
  mode: single
- id: victron_solar_charger_error_notifications
  alias: Victron - Solar Charger Error Notifications
  description: Notify when a SmartSolar charger enters a real error state; ignore
    no_error, unknown, and unavailable transitions.
  triggers:
  - trigger: state
    entity_id:
    - sensor.smartsolar_charger_mppt_100_30_id_278_error_code
    - sensor.smartsolar_charger_mppt_100_30_id_279_error_code
    not_to:
    - no_error
    - unknown
    - unavailable
  actions:
  - action: notify.send_message
    continue_on_error: true
    target:
      entity_id: notify.msphone29
    data:
      title: Victron SmartSolar Warning
      message: 'SmartSolar charger issue on {{ trigger.to_state.name }}: {{ trigger.to_state.state
        }}

        '
  - action: persistent_notification.create
    data:
      notification_id: victron_solar_charger_error
      title: Victron SmartSolar Warning
      message: 'SmartSolar charger issue on {{ trigger.to_state.name }}: {{ trigger.to_state.state
        }}'
  mode: queued
  max: 10
- id: victron_system_state_warning
  alias: Victron - System State Warning
  description: Notify only when the GX system state enters the fault state.
  triggers:
  - trigger: state
    entity_id:
    - sensor.gx_device_system_state
    to: fault
  actions:
  - action: notify.send_message
    continue_on_error: true
    target:
      entity_id: notify.msphone29
    data:
      title: Victron GX System Warning
      message: 'GX system state changed: {{ trigger.to_state.state }}'
  - action: persistent_notification.create
    data:
      notification_id: victron_system_state_warning
      title: Victron GX System Warning
      message: 'GX system state changed: {{ trigger.to_state.state }}'
  mode: single
- id: water_mode_state_machine_transition
  alias: Water - Apply Target Mode
  description: Apply selected water mode with sequential valve transitions.
  triggers:
  - trigger: state
    entity_id:
    - input_select.water_mode_target
  conditions:
  - condition: state
    entity_id: input_boolean.water_maintenance
    state: 'off'
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.from_state is not
      none and trigger.to_state.state != trigger.from_state.state }}'
  actions:
  - action: script.water_set_mode
    data:
      mode: '{{ trigger.to_state.state }}'
  mode: queued
- id: water_heating_control
  alias: Water - Heating Control
  description: Keep boiler temperature near the configured target using the water
    heater relay.
  triggers:
  - trigger: state
    entity_id:
    - sensor.boiler_temp
    - input_boolean.water_heating_enabled
    - input_number.water_heating_target_temp
    - input_number.water_heating_hysteresis
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.water_maintenance
    state: 'off'
  actions:
  - variables:
      heating_enabled: '{{ is_state(''input_boolean.water_heating_enabled'', ''on'')
        }}'
      boiler_temp: '{{ states(''sensor.boiler_temp'') | float(none) }}'
      target_temp: '{{ states(''input_number.water_heating_target_temp'') | float(45)
        }}'
      hysteresis: '{{ states(''input_number.water_heating_hysteresis'') | float(3)
        }}'
      lower_limit: '{{ target_temp - hysteresis }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not heating_enabled }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.water_heater_relay
    - conditions:
      - condition: template
        value_template: '{{ heating_enabled and boiler_temp is not none and boiler_temp
          <= lower_limit }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.water_heater_relay
    - conditions:
      - condition: template
        value_template: '{{ heating_enabled and boiler_temp is not none and boiler_temp
          >= target_temp }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.water_heater_relay
  mode: single
- id: floorheating_auto_off_without_ac_input
  alias: Floor Heating - Auto Disable Without AC Input
  description: 'Independent safety cutout: no Shore Power, disabled heating, invalid/stale
    temperatures, or thermostat off. Replaces unsafe 500 W AC-input inference. Turns
    physical relay off directly even during minimum heating time.'
  triggers:
  - trigger: state
    entity_id:
    - sensor.gx_device_ac_active_input_source
    - binary_sensor.shore_power_available
    - binary_sensor.floor_heating_temperature_safe
    - input_boolean.floor_heating_enabled
    - switch.floorheating
    - climate.floor_heating
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: switch.floorheating
    state: 'on'
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: binary_sensor.floor_heating_permitted
        state: 'on'
    - condition: not
      conditions:
      - condition: state
        entity_id: sensor.gx_device_ac_active_input_source
        state: shore_power
    - condition: state
      entity_id: climate.floor_heating
      state: 'off'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.floorheating
  mode: restart
- id: floorheating_turn_off_when_ac_input_inactive
  alias: Floor Heating - Disable On Inactive AC Input
  description: Turn off floor heating when the inverter AC input becomes inactive.
  triggers:
  - trigger: state
    entity_id:
    - sensor.inverter_active_ac_input
  conditions:
  - condition: state
    entity_id: switch.floorheating
    state: 'on'
  - condition: template
    value_template: '{% set ac_input = trigger.to_state.state | lower | trim %} {%
      set inactive = [''0'', ''off'', ''none'', ''disconnected'', ''not available'',
      ''unknown'', ''unavailable'', ''false'', ''no input''] %} {{ ac_input in inactive
      or ac_input.startswith(''no '') }}

      '
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.floorheating
  mode: single
- id: update_ha_location_from_ewd108
  alias: Update Home Assistant Location from EWD108
  triggers:
  - minutes: /5
    trigger: time_pattern
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: device_tracker.jaskier_gps
      state:
      - unknown
      - unavailable
  - condition: numeric_state
    entity_id: device_tracker.jaskier_gps
    attribute: latitude
    above: -90
    below: 90
  - condition: numeric_state
    entity_id: device_tracker.jaskier_gps
    attribute: longitude
    above: -180
    below: 180
  - condition: not
    conditions:
    - condition: zone
      entity_id: device_tracker.jaskier_gps
      zone: zone.home
  actions:
  - action: homeassistant.set_location
    data:
      latitude: '{{ state_attr(''device_tracker.jaskier_gps'', ''latitude'') | float
        }}'
      longitude: '{{ state_attr(''device_tracker.jaskier_gps'', ''longitude'') | float
        }}'
  mode: single
- id: '1783884443396'
  alias: Set Normal Water Mode is Tank is full
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.water_height
    above: 55
  conditions:
  - condition: state
    entity_id: input_boolean.water_maintenance
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_select.water_mode_current
      state:
      - Pump Filling
    - condition: state
      entity_id: input_select.water_mode_current
      state:
      - Grid Filling
  actions:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.water_mode_target
    data:
      option: Normal
  mode: single
- id: '1786893093855'
  alias: Turn On Air Compressor With Engine
  description: ''
  triggers:
  - trigger: state
    entity_id: binary_sensor.jaskier_wican_obd_pro_engine_on
    to: 'on'
    for: 00:01:00
  - trigger: state
    entity_id: input_boolean.air_compressor_engine
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.air_compressor_engine
    state: 'on'
  - condition: state
    entity_id: binary_sensor.jaskier_wican_obd_pro_engine_on
    state: 'on'
    for: 00:01:00
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.relay_7
    data: {}
  mode: restart
- id: '1786893299082'
  alias: Turn Off Air Compressor With Engine
  description: ''
  triggers:
  - trigger: state
    entity_id: binary_sensor.jaskier_wican_obd_pro_engine_on
    from: 'on'
  - trigger: state
    entity_id: input_boolean.air_compressor_engine
    to: 'off'
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.relay_7
    data: {}
  mode: restart
- id: '1786996780821'
  alias: Toggle Inverter Power On Double Press
  description: This automation toggles the inverter power on double press of a remote
    button.
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: e4:56:ac:ff:fe:56:8b:8c
      command: 'on'
  conditions: []
  actions:
  - action: switch.toggle
    metadata: {}
    target:
      entity_id: switch.inverter_power
    data: {}
  mode: single
- id: '1787035861878'
  alias: Jaskier Trip - Capture Start
  description: Capture the OBD odometer, time, and EWD108 position when Jaskier's
    engine starts. This baseline drives the current-trip distance and the completed
    trip record.
  triggers:
  - trigger: state
    entity_id: binary_sensor.jaskier_wican_obd_pro_engine_on
    from: 'off'
    to: 'on'
    id: engine_started
  conditions:
  - condition: state
    entity_id: binary_sensor.jaskier_wican_obd_pro_engine_on
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.jaskier_wican_obd_pro_31_distancesincecodeclear
      state:
      - unknown
      - unavailable
  actions:
  - variables:
      start_location: '{% if has_value(''device_tracker.jaskier_gps'') %}{{ state_attr(''device_tracker.jaskier_gps'',
        ''latitude'') }},{{ state_attr(''device_tracker.jaskier_gps'', ''longitude'')
        }}{% else %}Unknown{% endif %}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jaskier_trip_start_odometer
    data:
      value: '{{ states(''sensor.jaskier_wican_obd_pro_31_distancesincecodeclear'')
        | float }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.jaskier_trip_started_at
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.jaskier_trip_start_location
    data:
      value: '{{ start_location }}'
  mode: restart
- id: '1787035862435'
  alias: Jaskier Trip - Record End
  description: At engine-off, pulse the completed distance for history graphs and
    add a dated trip with EWD108 endpoints to the Jaskier Trips calendar.
  triggers:
  - trigger: state
    entity_id: binary_sensor.jaskier_wican_obd_pro_engine_on
    from: 'on'
    to: 'off'
    id: engine_stopped
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.jaskier_wican_obd_pro_31_distancesincecodeclear
      state:
      - unknown
      - unavailable
  - condition: numeric_state
    entity_id: input_number.jaskier_trip_start_odometer
    above: 0
  actions:
  - variables:
      start_odometer: '{{ states(''input_number.jaskier_trip_start_odometer'') | float(0)
        }}'
      end_odometer: '{{ states(''sensor.jaskier_wican_obd_pro_31_distancesincecodeclear'')
        | float(0) }}'
      trip_distance: '{{ ([end_odometer - start_odometer, 0] | max) | round(1) }}'
      start_time: '{{ states(''input_datetime.jaskier_trip_started_at'') }}'
      end_time: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      start_location: '{{ states(''input_text.jaskier_trip_start_location'') }}'
      end_location: '{% if has_value(''device_tracker.jaskier_gps'') %}{{ state_attr(''device_tracker.jaskier_gps'',
        ''latitude'') }},{{ state_attr(''device_tracker.jaskier_gps'', ''longitude'')
        }}{% else %}Unknown{% endif %}'
  - condition: template
    value_template: '{{ trip_distance | float(0) >= 0.1 }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.jaskier_completed_trip_pulse
    data:
      value: '{{ trip_distance }}'
  - action: calendar.create_event
    target:
      entity_id: calendar.jaskier_trips
    data:
      summary: Jaskier trip — {{ trip_distance }} km
      start_date_time: '{{ start_time }}'
      end_date_time: '{{ end_time }}'
      location: '{{ end_location }}'
      description: 'Distance: {{ trip_distance }} km

        Start: {{ start_location }}

        End: {{ end_location }}

        Route: https://www.google.com/maps/dir/?api=1&origin={{ start_location }}&destination={{
        end_location }}'
  - delay:
      minutes: 1
  - action: input_number.set_value
    target:
      entity_id: input_number.jaskier_completed_trip_pulse
    data:
      value: 0
  mode: queued
  max: 5
- id: '1787036121051'
  alias: Jaskier Trip - Reset Pulse After Restart
  description: Guarantee the completed-trip entity returns to zero if Home Assistant
    restarted during its one-minute pulse.
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.jaskier_completed_trip_pulse
    data:
      value: 0
  mode: single
- id: '1787042217987'
  alias: Water - Maintenance Gate
  description: Suppress normal water and hot-water automation during service overrides.
    Stop active transitions on entry and only leave maintenance when the valve layout
    matches a known water mode (the pump state does not define the mode; Grid modes
    switch the pump off).
  triggers:
  - trigger: state
    entity_id: input_boolean.water_maintenance
    to: 'on'
    id: enabled
  - trigger: state
    entity_id: input_boolean.water_maintenance
    to: 'off'
    id: disabled
  - trigger: homeassistant
    event: start
    id: startup
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - enabled
        - startup
      - condition: state
        entity_id: input_boolean.water_maintenance
        state: 'on'
      sequence:
      - action: script.turn_off
        target:
          entity_id:
          - script.water_mode_grid
          - script.water_mode_grid_filling
          - script.water_mode_normal
          - script.water_mode_pump_filling
          - script.water_set_mode
          - script.water_transition_grid_filling_to_grid
          - script.water_transition_grid_to_grid_filling
          - script.water_transition_grid_to_normal
          - script.water_transition_grid_to_pump_filling
          - script.water_transition_grid_filling_to_normal
          - script.water_transition_grid_filling_to_pump_filling
          - script.water_transition_normal_to_grid
          - script.water_transition_normal_to_grid_filling
          - script.water_transition_normal_to_pump_filling
          - script.water_transition_pump_filling_to_grid
          - script.water_transition_pump_filling_to_grid_filling
          - script.water_transition_pump_filling_to_normal
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.water_heating_enabled
      - action: switch.turn_off
        target:
          entity_id: switch.water_heater_relay
      - action: persistent_notification.create
        data:
          notification_id: water_maintenance_active
          title: Water Maintenance active
          message: Normal water-mode transitions, tank-full mode changes, and automatic
            hot-water control are suppressed. Use only the manual controls on the
            Water Maintenance view.
    - conditions:
      - condition: trigger
        id: disabled
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id:
            - switch.water_valve_pump_overwrite
            - switch.water_valve_loop
            - switch.water_valve_grid
            - switch.water_valve_tank
            state: 'off'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_current
            data:
              option: Normal
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_target
            data:
              option: Normal
        - conditions:
          - condition: state
            entity_id:
            - switch.water_valve_pump_overwrite
            - switch.water_valve_loop
            - switch.water_valve_grid
            state: 'on'
          - condition: state
            entity_id: switch.water_valve_tank
            state: 'off'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_current
            data:
              option: Pump Filling
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_target
            data:
              option: Pump Filling
        - conditions:
          - condition: state
            entity_id:
            - switch.water_valve_pump_overwrite
            - switch.water_valve_tank
            state: 'off'
          - condition: state
            entity_id:
            - switch.water_valve_loop
            - switch.water_valve_grid
            state: 'on'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.water_pump_relay
            note: Grid Filling runs with the pump OFF.
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_current
            data:
              option: Grid Filling
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_target
            data:
              option: Grid Filling
        - conditions:
          - condition: state
            entity_id: switch.water_valve_pump_overwrite
            state: 'off'
          - condition: state
            entity_id:
            - switch.water_valve_loop
            - switch.water_valve_grid
            - switch.water_valve_tank
            state: 'on'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.water_pump_relay
            note: Grid runs with the pump OFF.
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_current
            data:
              option: Grid
          - action: input_select.select_option
            target:
              entity_id: input_select.water_mode_target
            data:
              option: Grid
        default:
        - action: persistent_notification.create
          data:
            notification_id: water_maintenance_exit_blocked
            title: Water Maintenance exit blocked
            message: Valve states do not match a known water mode. Maintenance has
              been re-enabled; correct the manual valve states before trying again.
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.water_maintenance
        - stop: Physical water state is not a recognized mode.
          error: true
      - action: persistent_notification.dismiss
        data:
          notification_id: water_maintenance_active
      - action: persistent_notification.dismiss
        data:
          notification_id: water_maintenance_exit_blocked
  mode: queued
  max: 3
- id: water_mode_reconcile_on_start
  alias: Water - Reconcile Mode on Start
  description: 'Restore the logical water mode from the physical valve layout. The
    pump state does not define the mode: the pump is switched off whenever water is
    not used or nobody is home. Grid and Grid Filling require the pump OFF, so it
    is switched off there. Fault only when the valve layout matches no known mode.'
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.water_maintenance
    state: 'off'
  actions:
  - wait_template: "{{ has_value('switch.water_valve_pump_overwrite') and\n   has_value('switch.water_valve_loop')
      and\n   has_value('switch.water_valve_grid') and\n   has_value('switch.water_valve_tank')
      }}"
    timeout: 00:02:00
    continue_on_timeout: false
    note: Valves are Modbus coils; wait until all four report a value after start.
  - choose:
    - conditions:
      - condition: state
        entity_id:
        - switch.water_valve_pump_overwrite
        - switch.water_valve_loop
        - switch.water_valve_grid
        - switch.water_valve_tank
        state: 'off'
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.water_mode_current
          - input_select.water_mode_target
        data:
          option: Normal
    - conditions:
      - condition: state
        entity_id:
        - switch.water_valve_pump_overwrite
        - switch.water_valve_loop
        - switch.water_valve_grid
        state: 'on'
      - condition: state
        entity_id: switch.water_valve_tank
        state: 'off'
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.water_mode_current
          - input_select.water_mode_target
        data:
          option: Pump Filling
    - conditions:
      - condition: state
        entity_id:
        - switch.water_valve_pump_overwrite
        - switch.water_valve_tank
        state: 'off'
      - condition: state
        entity_id:
        - switch.water_valve_loop
        - switch.water_valve_grid
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.water_pump_relay
        note: Grid Filling runs with the pump OFF.
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.water_mode_current
          - input_select.water_mode_target
        data:
          option: Grid Filling
    - conditions:
      - condition: state
        entity_id: switch.water_valve_pump_overwrite
        state: 'off'
      - condition: state
        entity_id:
        - switch.water_valve_loop
        - switch.water_valve_grid
        - switch.water_valve_tank
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.water_pump_relay
        note: Grid runs with the pump OFF.
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.water_mode_current
          - input_select.water_mode_target
        data:
          option: Grid
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.water_pump_relay
    - action: input_select.select_option
      target:
        entity_id: input_select.water_mode_current
      data:
        option: Fault
    - action: persistent_notification.create
      data:
        notification_id: water_mode_fault
        title: Water mode fault
        message: Valve states (tank {{ states('switch.water_valve_tank') }}, loop
          {{ states('switch.water_valve_loop') }}, pump overwrite {{ states('switch.water_valve_pump_overwrite')
          }}, grid {{ states('switch.water_valve_grid') }}) do not match a known water
          mode. The water pump was stopped; inspect the valves before selecting another
          mode.
    - stop: Valve layout is not a recognized mode.
  - action: persistent_notification.dismiss
    data:
      notification_id: water_mode_fault
    note: A recognized valve layout clears any earlier fault notice.
  mode: single
- id: '1787384467184'
  alias: Starter Battery Charging
  description: Automatically charge the starter battery only while an external AC
    input is active (shore power/grid/generator). Require 30 seconds of stable source
    before starting; disconnect/unknown/unavailable cuts off immediately. Reconcile
    after HA start, relay reconnects/manual changes and every minute. Replaces the
    previous voltage-trigger logic.
  triggers:
  - trigger: state
    entity_id:
    - sensor.gx_device_ac_active_input_source
    - binary_sensor.inverter_connected
    - sensor.inverter_state_of_ignore_ac_in_1
    - sensor.inverter_input_voltage_l1
    - switch.front_controller_starter_battery_charger
    to:
  - trigger: state
    entity_id: sensor.gx_device_ac_active_input_source
    to:
    - shore_power
    - grid
    - generator
    for:
      seconds: 30
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.gx_device_ac_active_input_source
          state: shore_power
          for:
            seconds: 30
        - condition: state
          entity_id: sensor.gx_device_ac_active_input_source
          state: grid
          for:
            seconds: 30
        - condition: state
          entity_id: sensor.gx_device_ac_active_input_source
          state: generator
          for:
            seconds: 30
      - condition: state
        entity_id: binary_sensor.inverter_connected
        state: 'on'
      - condition: state
        entity_id: sensor.inverter_state_of_ignore_ac_in_1
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.inverter_input_voltage_l1
        above: 190
        below: 255
      sequence:
      - condition: not
        conditions:
        - condition: state
          entity_id: switch.front_controller_starter_battery_charger
          state: 'on'
      - action: switch.turn_on
        target:
          entity_id: switch.front_controller_starter_battery_charger
    default:
    - condition: not
      conditions:
      - condition: state
        entity_id: switch.front_controller_starter_battery_charger
        state: 'off'
    - action: switch.turn_off
      target:
        entity_id: switch.front_controller_starter_battery_charger
  mode: restart
- id: floor_heating_presence_memory
  alias: Occupancy - Presence Memory
  description: Shared Jaskier occupancy (used by floor heating and water). Record
    confirmed presence only after 2 continuous minutes; refresh each minute only after
    the same confirmation. Short pulses never refresh the persistent 45-minute occupancy
    memory in input_datetime.jaskier_last_presence. Survives HA restarts.
  triggers:
  - trigger: state
    entity_id: binary_sensor.presents_sensor_zg_204zx
    to: 'on'
    for:
      minutes: 2
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: binary_sensor.presents_sensor_zg_204zx
    state: 'on'
    for:
      minutes: 2
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.jaskier_last_presence
    data:
      timestamp: '{{ now().timestamp() }}'
  mode: restart
- id: floor_heating_night_presence
  alias: Floor Heating - Night Presence
  description: Latch confirmed occupancy through 22:00–08:00 to protect sleeping occupants.
    Daytime resets the latch; manual Idle bypasses it.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.floor_heating_night
    - binary_sensor.jaskier_occupied
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.floor_heating_night
        state: 'off'
      - condition: state
        entity_id: input_boolean.floor_heating_night_occupied
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.floor_heating_night_occupied
    - conditions:
      - condition: state
        entity_id: binary_sensor.floor_heating_night
        state: 'on'
      - condition: state
        entity_id: binary_sensor.jaskier_occupied
        state: 'on'
      - condition: state
        entity_id: input_boolean.floor_heating_night_occupied
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.floor_heating_night_occupied
  mode: restart
- id: floor_heating_comfort_control
  alias: Floor Heating - Comfort Control
  description: Apply Auto/day/night/idle setpoint (20/18/10°C initially) to the native
    thermostat; main enable, shore power and valid temperature are mandatory. Periodic
    and startup reconciliation; safety bypasses minimum heating time.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.floor_heating_enabled
    - binary_sensor.floor_heating_permitted
    - sensor.floor_heating_target_temperature
    - sensor.floor_heating_temperature
    - sensor.gx_device_ac_active_input_source
    - climate.floor_heating
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.floor_heating_permitted
        state: 'on'
      - condition: state
        entity_id: sensor.gx_device_ac_active_input_source
        state: shore_power
      - condition: numeric_state
        entity_id: sensor.floor_heating_target_temperature
        above: 4
        below: 25
      sequence:
      - if:
        - '{{ state_attr(''climate.floor_heating'',''temperature'') != states(''sensor.floor_heating_target_temperature'')
          | float(none) }}'
        then:
        - action: climate.set_temperature
          target:
            entity_id: climate.floor_heating
          data:
            temperature: '{{ states(''sensor.floor_heating_target_temperature'') |
              float }}'
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: climate.floor_heating
            state: heat
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.floor_heating
          data:
            hvac_mode: heat
    default:
    - if:
      - condition: state
        entity_id: switch.floorheating
        state: 'on'
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.floorheating
        continue_on_error: true
    - if:
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.floor_heating
          state: 'off'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.floor_heating
        data:
          hvac_mode: 'off'
  mode: restart
- id: water_leak_protection
  alias: Water - Leak Protection
  description: 'Stop the water pump and warn Mateusz when Moisture under Pump detects
    water, or when the pump is switched on while the sensor is still wet. Safety function:
    also active during Water Maintenance. Valves are not changed. A pump run-time
    check is planned once a pump current/pressure sensor is installed (the relay only
    enables the pump; its own pressure switch decides when it runs).'
  triggers:
  - trigger: state
    entity_id: binary_sensor.sonoff_snzb_05p
    to: 'on'
    id: moisture
  - trigger: state
    entity_id: switch.water_pump_relay
    to: 'on'
    id: pump_on
    note: Pump switched on while the sensor is still wet.
  - trigger: homeassistant
    event: start
    id: startup
  conditions:
  - condition: state
    entity_id: binary_sensor.sonoff_snzb_05p
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.water_pump_relay
    continue_on_error: true
    note: Continue so the warning is still sent if the Modbus write fails.
  - variables:
      pump_status: '{{ ''The water pump was switched off.'' if is_state(''switch.water_pump_relay'',
        ''off'') else ''WARNING: the water pump did NOT switch off (state: '' ~ states(''switch.water_pump_relay'')
        ~ ''). Cut its power manually.'' }}'
  - action: persistent_notification.create
    data:
      notification_id: water_leak_detected
      title: Water leak under the pump
      message: 'Moisture under Pump detected water at {{ now().strftime(''%H:%M'')
        }}. {{ pump_status }} Water mode: {{ states(''input_select.water_mode_current'')
        }}. Valves were not changed. Dry the sensor and fix the leak before switching
        the pump on again.'
  - action: notify.mobile_app_mateuszphone
    continue_on_error: true
    data:
      title: Water leak under the pump
      message: Moisture under Pump detected water. {{ pump_status }} Valves were not
        changed.
      data:
        tag: water_leak
        channel: Water alerts
        importance: high
        priority: high
        ttl: 0
  mode: queued
  max: 5
- id: water_pump_off_when_unoccupied
  alias: Water - Pump Off When Unoccupied
  description: Switch the water pump off when nobody is in Jaskier, using the shared
    binary_sensor.jaskier_occupied (same 45-minute presence memory as floor heating;
    an unavailable presence sensor counts as occupied). The water mode is not changed.
    Skipped while Water Maintenance is on.
  triggers:
  - trigger: state
    entity_id: binary_sensor.jaskier_occupied
    to: 'off'
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: binary_sensor.jaskier_occupied
    state: 'off'
  - condition: state
    entity_id: switch.water_pump_relay
    state: 'on'
  - condition: state
    entity_id: input_boolean.water_maintenance
    state: 'off'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.water_pump_relay
  mode: single
