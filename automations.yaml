  max: 10
- id: victron_system_state_warning
  alias: Victron - System State Warning
  description: Notify only when the GX system state enters the fault state.
  triggers:
  - trigger: state
    entity_id:
    - sensor.gx_device_system_state
    to: fault
  actions:
  - action: notify.send_message
    continue_on_error: true
    target:
      entity_id: notify.msphone29
    data:
      title: Victron GX System Warning
      message: 'GX system state changed: {{ trigger.to_state.state }}'
  - action: persistent_notification.create
    data:
      notification_id: victron_system_state_warning
      title: Victron GX System Warning
      message: 'GX system state changed: {{ trigger.to_state.state }}'
  mode: single
- id: water_mode_state_machine_transition
  alias: Water - Apply Target Mode
  description: Apply selected water mode with sequential valve transitions.
  triggers:
  - trigger: state
    entity_id:
    - input_select.water_mode_target
  conditions:
  - condition: state
    entity_id: input_boolean.water_maintenance
    state: 'off'
    note: Maintenance mode suppresses normal water-mode transitions.
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.from_state is not
      none and trigger.to_state.state != trigger.from_state.state }}'
  actions:
  - action: script.water_set_mode
    data:
      mode: '{{ trigger.to_state.state }}'
  mode: queued
- id: water_heating_control
  alias: Water - Heating Control
  description: Keep boiler temperature near the configured target using the water
    heater relay.
  triggers:
  - trigger: state
    entity_id:
    - sensor.boiler_temp
    - input_boolean.water_heating_enabled
    - input_number.water_heating_target_temp
    - input_number.water_heating_hysteresis
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - variables:
      heating_enabled: '{{ is_state(''input_boolean.water_heating_enabled'', ''on'')
        }}'
      boiler_temp: '{{ states(''sensor.boiler_temp'') | float(none) }}'
      target_temp: '{{ states(''input_number.water_heating_target_temp'') | float(45)
        }}'
      hysteresis: '{{ states(''input_number.water_heating_hysteresis'') | float(3)
        }}'
      lower_limit: '{{ target_temp - hysteresis }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not heating_enabled }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.water_heater_relay
    - conditions:
      - condition: template
        value_template: '{{ heating_enabled and boiler_temp is not none and boiler_temp
          <= lower_limit }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.water_heater_relay
    - conditions:
      - condition: template
        value_template: '{{ heating_enabled and boiler_temp is not none and boiler_temp
          >= target_temp }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.water_heater_relay
  mode: single
- id: floorheating_auto_off_without_ac_input
  alias: Floor Heating - Auto Disable Without AC Input
  description: Turn off floor heating after 5 minutes unless the inverter reports
    an active AC input.
  triggers:
  - trigger: state
    entity_id:
    - switch.floorheating
    to: 'on'
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: switch.floorheating
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.inverter_input_power_l1
    below: 500
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.floorheating
  mode: single
- id: floorheating_turn_off_when_ac_input_inactive
  alias: Floor Heating - Disable On Inactive AC Input
  description: Turn off floor heating when the inverter AC input becomes inactive.
  triggers:
  - trigger: state
    entity_id:
    - sensor.inverter_active_ac_input
  conditions:
  - condition: state
    entity_id: switch.floorheating
    state: 'on'
  - condition: template
    value_template: '{% set ac_input = trigger.to_state.state | lower | trim %} {%
      set inactive = [''0'', ''off'', ''none'', ''disconnected'', ''not available'',
      ''unknown'', ''unavailable'', ''false'', ''no input''] %} {{ ac_input in inactive
      or ac_input.startswith(''no '') }}

      '
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.floorheating
  mode: single
- id: update_ha_location_from_ewd108
  alias: Update Home Assistant Location from EWD108
  mode: single
  trigger:
  - platform: time_pattern
    minutes: /5
  condition:
  - condition: state
    entity_id: sensor.ewd108_fix_status
    state: Valid
  - condition: numeric_state
    entity_id: sensor.ewd108_signed_latitude
    above: -90
    below: 90
  - condition: numeric_state
    entity_id: sensor.ewd108_signed_longitude
    above: -180
    below: 180
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.ewd108_signed_latitude
      above: 0.000001
    - condition: numeric_state
      entity_id: sensor.ewd108_signed_latitude
      below: -0.000001
    - condition: numeric_state
      entity_id: sensor.ewd108_signed_longitude
      above: 0.000001
    - condition: numeric_state
      entity_id: sensor.ewd108_signed_longitude
      below: -0.000001
  - condition: not
    conditions:
    - condition: zone
      entity_id: device_tracker.jaskier_gps
      zone: zone.home
  action:
  - service: homeassistant.set_location
    data:
      latitude: '{{ states(''sensor.ewd108_signed_latitude'') | float }}'
      longitude: '{{ states(''sensor.ewd108_signed_longitude'') | float }}'
- id: '1783884443396'
  alias: Set Normal Water Mode is Tank is full
