substitutions:
  device_name: front-controller
  friendly_name: "Front controller"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Front controlle Fallback Hotspot
    password: "YrPiPBb7ZiOp"
# -------------------------------------------------------------------
# Ethernet / PoE
# -------------------------------------------------------------------

# ethernet:
#   type: W5500
#   clk_pin: GPIO15
#   mosi_pin: GPIO13
#   miso_pin: GPIO14
#   cs_pin: GPIO16
#   interrupt_pin: GPIO12


# -------------------------------------------------------------------
# I2C
# Used by the onboard TCA9554 relay expander
# -------------------------------------------------------------------

i2c:
  sda: GPIO42
  scl: GPIO41
  scan: false
  frequency: 100kHz
  id: i2c_bus


# -------------------------------------------------------------------
# Relay I/O expander
# -------------------------------------------------------------------

pca9554:
  - id: relay_expander
    address: 0x20


# -------------------------------------------------------------------
# CH1 - Starter battery charger
# -------------------------------------------------------------------

switch:
  - platform: gpio
    id: starter_battery_charger
    name: "Starter Battery Charger"

    pin:
      pca9554: relay_expander
      number: 0
      mode:
        output: true
      inverted: false

    restore_mode: ALWAYS_OFF


# -------------------------------------------------------------------
# Diagnostics
# -------------------------------------------------------------------

binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic