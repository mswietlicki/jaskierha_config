# Board: IoTorero/Athom AR01 V3 ESP32
# Definition: definitions/boards/generic-esp32/manifest.yaml

substitutions: 
  name: "ar01-ir-rf-remote" 
  friendly_name: "IR/RF Remote"
  
esphome: 
  name: ${name} 
  name_add_mac_suffix: false 
  friendly_name: ${friendly_name} 
  platformio_options: 
    board_build.flash_mode: dio
    
esp32:
  board: esp32dev
  variant: esp32
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: "gozBwnyo0upkNgkDRPIwjK059aJ/MMZz2nl3VvQJxlU="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://brown-studios/esphome-maxxfan-protocol@main
    components:
      - maxxfan_protocol
        
maxxfan_protocol:

# ============================================================
# AR01 V3 transmitters
#
# GPIO25: IR transmitter
# GPIO18: 433 MHz RF transmitter
# ============================================================

remote_transmitter:
  - id: ir_transmitter
    pin:
      number: GPIO25
      inverted: false
    carrier_duty_percent: 50%

  - id: rf_transmitter
    pin:
      number: GPIO18
      inverted: false
    carrier_duty_percent: 100%

# ============================================================
# AR01 V3 status LED
#
# GPIO27 is active-low.
# The status_led platform also indicates ESPHome warnings/errors.
# internal: true hides it from Home Assistant.
# ============================================================

light:
  - platform: status_led
    id: ar01_status_led
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO27
      inverted: true

script:
  # ============================================================
  # MaxxFan infrared commands
  # ============================================================

  - id: maxxfan_off
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: false
          cover_open: false
          fan_exhaust: true
          fan_speed: 10

      - delay: 150ms
      - light.turn_off: ar01_status_led

  # ------------------------------------------------------------
  # Air out / exhaust
  # ------------------------------------------------------------

  - id: maxxfan_out_low
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: true
          cover_open: true
          fan_exhaust: true
          fan_speed: 30

      - delay: 150ms
      - light.turn_off: ar01_status_led

  - id: maxxfan_out_mid
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: true
          cover_open: true
          fan_exhaust: true
          fan_speed: 60

      - delay: 150ms
      - light.turn_off: ar01_status_led

  - id: maxxfan_out_full
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: true
          cover_open: true
          fan_exhaust: true
          fan_speed: 100

      - delay: 150ms
      - light.turn_off: ar01_status_led

  - id: maxxfan_out_auto_22c
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: true
          fan_exhaust: true
          auto_mode: true
          auto_temperature: 72

      - delay: 150ms
      - light.turn_off: ar01_status_led

  # ------------------------------------------------------------
  # Air in / intake
  # ------------------------------------------------------------

  - id: maxxfan_in_low
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: true
          cover_open: true
          fan_exhaust: false
          fan_speed: 30

      - delay: 150ms
      - light.turn_off: ar01_status_led

  - id: maxxfan_in_mid
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: true
          cover_open: true
          fan_exhaust: false
          fan_speed: 60

      - delay: 150ms
      - light.turn_off: ar01_status_led

  - id: maxxfan_in_full
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: true
          cover_open: true
          fan_exhaust: false
          fan_speed: 100

      - delay: 150ms
      - light.turn_off: ar01_status_led

  - id: maxxfan_in_auto_22c
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_maxxfan:
          transmitter_id: ir_transmitter
          fan_on: true
          fan_exhaust: false
          auto_mode: true
          auto_temperature: 72

      - delay: 150ms
      - light.turn_off: ar01_status_led

  # ============================================================
  # Princeton 24-bit 433.88 MHz command
  #
  # Key:    0x00DEF8A1
  # Yek:    0x00851F7B
  # Serial: 0xDEF8A
  # Button: 1
  # Te:     321 microseconds
  # Gap:    Te * 31 = 9951 microseconds
  #
  # Binary:
  # 110111101111100010100001
  # ============================================================

  - id: rf_gajowa_gate
    mode: restart
    then:
      - light.turn_on: ar01_status_led

      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: rf_transmitter
          code: "110111101111100010100001"
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 3]
            one: [3, 1]
            inverted: false
          repeat:
            times: 8
            wait_time: 0ms

      - delay: 150ms
      - light.turn_off: ar01_status_led

button:
  # ============================================================
  # MaxxFan buttons
  # ============================================================

  - platform: template
    name: "MaxxFan Off"
    icon: mdi:fan-off
    on_press:
      - script.execute: maxxfan_off

  - platform: template
    name: "MaxxFan Out Low"
    icon: mdi:fan-speed-1
    on_press:
      - script.execute: maxxfan_out_low

  - platform: template
    name: "MaxxFan Out Mid"
    icon: mdi:fan-speed-2
    on_press:
      - script.execute: maxxfan_out_mid

  - platform: template
    name: "MaxxFan Out Full"
    icon: mdi:fan-speed-3
    on_press:
      - script.execute: maxxfan_out_full

  - platform: template
    name: "MaxxFan Out Auto 22C"
    icon: mdi:thermostat-auto
    on_press:
      - script.execute: maxxfan_out_auto_22c

  - platform: template
    name: "MaxxFan In Low"
    icon: mdi:fan-speed-1
    on_press:
      - script.execute: maxxfan_in_low

  - platform: template
    name: "MaxxFan In Mid"
    icon: mdi:fan-speed-2
    on_press:
      - script.execute: maxxfan_in_mid

  - platform: template
    name: "MaxxFan In Full"
    icon: mdi:fan-speed-3
    on_press:
      - script.execute: maxxfan_in_full

  - platform: template
    name: "MaxxFan In Auto 22C"
    icon: mdi:thermostat-auto
    on_press:
      - script.execute: maxxfan_in_auto_22c

  # ============================================================
  # 433 MHz RF button
  # ============================================================

  - platform: template
    name: "Gajowa Gate"
    icon: mdi:gate
    on_press:
      - script.execute: rf_gajowa_gate
